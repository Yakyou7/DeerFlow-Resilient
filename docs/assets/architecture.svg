<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1020" width="1440" height="1020" style="background:#ffffff; font-family:'Virgil', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;">
  <defs>
    <!-- Soft Drop Shadows -->
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="shadow-md" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <filter id="shadow-lg" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.12"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- ================= HEADER SECTION ================= -->
  <g transform="translate(60, 35)">
    <rect x="0" y="0" width="1320" height="75" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="660" y="36" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">🦌 DeerFlow-Resilient Architecture</text>
    <text x="660" y="60" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">Production-Hardened SuperAgent Harness for 30+ Step Long-Horizon Autonomous Engineering</text>
  </g>

  <!-- ================= 1. INGRESS & INTENT LAYER ================= -->
  <g transform="translate(60, 130)">
    <!-- Container Card -->
    <rect x="0" y="0" width="1320" height="120" rx="14" fill="#f5f7ff" stroke="#c7d2fe" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="24" y="24" font-size="12" font-weight="700" fill="#4338ca" letter-spacing="0.08em">📥 INGRESS &amp; INTENT DISPATCH LAYER</text>

    <!-- User Task Card -->
    <g transform="translate(30, 38)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="380" height="64" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.8"/>
      <circle cx="28" cy="32" r="14" fill="#e0e7ff"/>
      <text x="28" y="37" text-anchor="middle" font-size="15">👤</text>
      <text x="52" y="27" font-size="14" font-weight="700" fill="#1e1b4b">User Task / Complex Mission</text>
      <text x="52" y="47" font-size="12" fill="#64748b">"Build microservice, fix bug &amp; verify tests"</text>
    </g>

    <!-- Arrow to Router -->
    <path d="M 410 70 L 490 70" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)"/>

    <!-- DynamicSkillRouter Card -->
    <g transform="translate(500, 38)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="580" height="64" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.8"/>
      <circle cx="28" cy="32" r="14" fill="#ede9fe"/>
      <text x="28" y="37" text-anchor="middle" font-size="15">⚡</text>
      <text x="52" y="27" font-size="14" font-weight="700" fill="#1e1b4b">DynamicSkillRouter (Zero-LLM JIT &lt;1ms)</text>
      <text x="52" y="47" font-size="12" fill="#475569">JIT Keyword &amp; Intent Matching • Trims 3,000+ chars of static prompt bloat</text>
    </g>

    <!-- Handoff to Core Arrow -->
    <path d="M 790 102 L 790 148" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  </g>

  <!-- ================= 2. HARNESS DEFENSE & CORE ENGINE ================= -->
  <g transform="translate(60, 280)">
    <!-- Main Layer Container -->
    <rect x="0" y="0" width="1320" height="350" rx="16" fill="#faf8ff" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="24" y="24" font-size="12" font-weight="700" fill="#6d28d9" letter-spacing="0.08em">🛡️ RUNTIME DEFENSE &amp; CORE REASONING LAYER (HARNESS)</text>

    <!-- 2.1 Lead Agent Central Runtime -->
    <g transform="translate(480, 40)" filter="url(#shadow-md)">
      <rect x="0" y="0" width="460" height="85" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
      <circle cx="34" cy="42" r="18" fill="#ddd6fe"/>
      <text x="34" y="48" text-anchor="middle" font-size="18">🦌</text>
      <text x="64" y="32" font-size="16" font-weight="700" fill="#2e1065">Lead Agent Orchestrator</text>
      <text x="64" y="52" font-size="12" font-weight="600" fill="#5b21b6">LangGraph StateGraph • ReAct Cycle Engine</text>
      <text x="64" y="70" font-size="11" fill="#6d28d9">Coordinates subagents, tools, memory, and defensive gates</text>
    </g>

    <!-- 2.2 Left Pillar: HarnessGuard Runtime Gate -->
    <g transform="translate(30, 40)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="410" height="280" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <rect x="0" y="0" width="410" height="38" rx="12" fill="#d1fae5"/>
      <text x="18" y="25" font-size="14" font-weight="700" fill="#064e3b">🛡️ HarnessGuard Runtime Defense (RFC-003)</text>

      <g transform="translate(18, 55)" font-size="12" fill="#065f46">
        <text y="0" font-weight="700" fill="#047857">1. Pre-Write AST Gate (ast.parse)</text>
        <text y="18" fill="#065f46">• Intercepts write_file &amp; str_replace before disk I/O</text>
        <text y="34" fill="#065f46">• Prevents 100% of syntax-broken Python writes</text>

        <text y="62" font-weight="700" fill="#047857">2. JSON Schema Syntax Gate (json.loads)</text>
        <text y="80" fill="#065f46">• Validates config payloads prior to save</text>

        <text y="108" font-weight="700" fill="#047857">3. Anti-Doom-Loop Finite State Machine</text>
        <text y="126" fill="#065f46">• Tracks sliding window error signatures</text>
        <text y="142" fill="#065f46">• Detects repeated failures (≥2) &amp; A→B→A→B oscillations</text>

        <text y="170" font-weight="700" fill="#047857">4. Targeted Remediation Injection</text>
        <text y="188" fill="#065f46">• Injects deterministic recovery hints into context</text>
        <text y="204" fill="#047857" font-weight="700">✓ 100% Write Corruption Block Prevention</text>
      </g>
    </g>

    <!-- 2.3 Center-Bottom: Context Compactor -->
    <g transform="translate(480, 145)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="460" height="175" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
      <rect x="0" y="0" width="460" height="36" rx="12" fill="#e9d5ff"/>
      <text x="18" y="24" font-size="14" font-weight="700" fill="#581c87">📉 Context Compactor (SummarizationMiddleware)</text>

      <g transform="translate(18, 55)" font-size="12" fill="#6b21a8">
        <text y="0" font-weight="700">Two-Stage Lossless Tool Pruning (RFC-001)</text>
        <text y="18">• Strips ephemeral tool outputs (ls, cat, curl dumps)</text>
        <text y="34">• Prunes obsolete failed attempts &amp; retry traces</text>
        
        <text y="60" font-weight="700">Quantitative Breakthrough:</text>
        <text y="78" fill="#581c87" font-weight="700">• -11,352 Tokens / Cycle (-74.8% token compaction)</text>
        <text y="94">• Extends effective context headroom by 4.6x</text>
        <text y="110">• Maintains immutable Structured Ledger of progress</text>
      </g>
    </g>

    <!-- 2.4 Right Pillar: AiMem Hierarchical Engine -->
    <g transform="translate(980, 40)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="310" height="280" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <rect x="0" y="0" width="310" height="38" rx="12" fill="#bae6fd"/>
      <text x="18" y="25" font-size="14" font-weight="700" fill="#0c4a6e">⚡ AiMem Engine (RFC-002)</text>

      <g transform="translate(18, 55)" font-size="12" fill="#0369a1">
        <text y="0" font-weight="700" fill="#0284c7">Sub-millisecond In-Memory Store</text>
        <text y="18" font-weight="700" fill="#0369a1">• 0.936 ms Retrieval Latency</text>
        <text y="34" font-weight="700" fill="#0369a1">• 0 API Token Query Overhead</text>

        <text y="62" font-weight="700">Three-Tier Memory Hierarchy:</text>
        <text y="80">• L1: Thread Session Working Cache</text>
        <text y="98">• L2: Local SQLite BM25 Inverted Index</text>
        <text y="116">• L3: Markdown Persistent Facts</text>

        <text y="144" font-weight="700">Key Capabilities:</text>
        <text y="162">• Recency Decay Weighting</text>
        <text y="180">• 100% Recall on Identifiers &amp; Paths</text>
        <text y="198" font-weight="700" fill="#0284c7">✓ Replaces 250ms Vector DB RTT</text>
      </g>
    </g>

    <!-- Intra-layer Connectors -->
    <path d="M 480 82 L 445 82" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
    <path d="M 940 82 L 975 82" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-sky)"/>
    <path d="M 710 125 L 710 140" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  </g>

  <!-- ================= 3. EXECUTION & WORKSPACE LAYER ================= -->
  <g transform="translate(60, 650)">
    <!-- Container Card -->
    <rect x="0" y="0" width="1320" height="235" rx="16" fill="#fffdfa" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="24" y="24" font-size="12" font-weight="700" fill="#b45309" letter-spacing="0.08em">⚙️ EXECUTION ENVIRONMENT &amp; SUBAGENT PROTOCOL</text>

    <!-- 3.1 Subagent Cluster -->
    <g transform="translate(30, 40)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="370" height="165" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
      <rect x="0" y="0" width="370" height="34" rx="12" fill="#fef3c7"/>
      <text x="16" y="23" font-size="14" font-weight="700" fill="#78350f">🤖 Subagent Cluster</text>
      <g transform="translate(16, 52)" font-size="12" fill="#92400e">
        <text y="0" font-weight="600">• general-purpose autonomous worker</text>
        <text y="20" font-weight="600">• bash command runner in sandbox</text>
        <text y="40">• Isolated turn budget &amp; dynamic tools</text>
        <text y="60">• Focused execution on delegated subtasks</text>
        <text y="85" font-weight="700" fill="#b45309">✓ Parallel subtask delegation</text>
      </g>
    </g>

    <!-- Connector: Subagent to Handoff -->
    <path d="M 400 122 L 445 122" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>

    <!-- 3.2 TypedHandoff Protocol -->
    <g transform="translate(450, 40)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="490" height="165" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
      <rect x="0" y="0" width="490" height="34" rx="12" fill="#fde68a"/>
      <text x="16" y="23" font-size="14" font-weight="700" fill="#78350f">📋 RFC-003 TypedHandoff Protocol</text>
      <g transform="translate(16, 52)" font-size="12" fill="#78350f">
        <text y="0" font-weight="700">Contractual Structured Return Schema:</text>
        <text y="18">• status: COMPLETED | BLOCKED | FAILED</text>
        <text y="36">• deliverables: list[file_paths | key_facts]</text>
        <text y="54">• attempted_paths &amp; fatal_blocks: deterministic traces</text>
        <text y="78" font-weight="700" fill="#92400e">Replaces Ambiguous Natural Language Summaries</text>
        <text y="96" font-weight="700" fill="#b45309">✓ Eliminates 60%~75% Subagent Verification Round-Trips</text>
      </g>
    </g>

    <!-- Connector: Handoff to Lead Agent -->
    <path d="M 695 40 L 695 -165" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-purple)"/>

    <!-- 3.3 Sandboxed Workspace -->
    <g transform="translate(980, 40)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="310" height="165" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
      <rect x="0" y="0" width="310" height="34" rx="12" fill="#d1fae5"/>
      <text x="16" y="23" font-size="14" font-weight="700" fill="#064e3b">📦 Sandboxed Workspace</text>
      <g transform="translate(16, 52)" font-size="12" fill="#065f46">
        <text y="0" font-weight="600">• /mnt/user-data/workspace</text>
        <text y="20">• Containerized execution sandbox</text>
        <text y="40">• AST-Verified disk writes only</text>
        <text y="60">• Zero filesystem corruption</text>
        <text y="85" font-weight="700" fill="#047857">✓ 100% Clean state preservation</text>
      </g>
    </g>

    <!-- Connector: Guard to Sandbox -->
    <path d="M 440 -60 Q 950 -30 980 100" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>

    <!-- Short-Circuit Block Callout -->
    <g transform="translate(30, -25)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="370" height="34" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
      <text x="185" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">🚫 [WRITE BLOCKED] Syntax Corrupted Code Dropped</text>
    </g>
  </g>

  <!-- ================= 4. EMPIRICAL BENCHMARKS KPI STRIP ================= -->
  <g transform="translate(60, 910)">
    <!-- Badge 1: Context -->
    <g transform="translate(0, 0)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="245" height="48" rx="10" fill="#f5f7ff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="20" y="22" font-size="12" font-weight="700" fill="#4338ca">CONTEXT COMPACTION</text>
      <text x="20" y="38" font-size="13" font-weight="800" fill="#1e1b4b">-74.8% Tokens (-11.3k)</text>
    </g>

    <!-- Badge 2: Memory Latency -->
    <g transform="translate(268, 0)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="245" height="48" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="20" y="22" font-size="12" font-weight="700" fill="#0369a1">MEMORY RETRIEVAL</text>
      <text x="20" y="38" font-size="13" font-weight="800" fill="#0c4a6e">0.936 ms (99.5% drop)</text>
    </g>

    <!-- Badge 3: Token Cost -->
    <g transform="translate(537, 0)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="245" height="48" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="22" font-size="12" font-weight="700" fill="#047857">MEMORY TOKEN COST</text>
      <text x="20" y="38" font-size="13" font-weight="800" fill="#064e3b">0 API Tokens (Free)</text>
    </g>

    <!-- Badge 4: Syntax Guard -->
    <g transform="translate(806, 0)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="245" height="48" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="20" y="22" font-size="12" font-weight="700" fill="#92400e">CODE WRITE DEFENSE</text>
      <text x="20" y="38" font-size="13" font-weight="800" fill="#78350f">100% Corruption Free</text>
    </g>

    <!-- Badge 5: Test Suite -->
    <g transform="translate(1075, 0)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="245" height="48" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
      <text x="20" y="22" font-size="12" font-weight="700" fill="#065f46">AUTOMATED TEST SUITE</text>
      <text x="20" y="38" font-size="13" font-weight="800" fill="#064e3b">132 / 132 Passed (100%)</text>
    </g>
  </g>
</svg>